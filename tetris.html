<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Tetris</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0f16; color: #f4f6f9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none; user-select: none;
  }
  #app {
    max-width: 420px; margin: 0 auto; padding: 16px 16px 24px;
    min-height: 100%; display: flex; flex-direction: column;
  }
  .title-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .title-row h1 { font-size: 22px; font-weight: 600; margin: 0; }
  .title-row .best { font-size: 13px; color: #8a97a8; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: #151c27; border: 1px solid #232d3d; border-radius: 10px; padding: 10px 12px; }
  .stat .label { font-size: 11px; color: #8a97a8; }
  .stat .value { font-size: 20px; font-weight: 600; margin-top: 2px; }
  .stat.score .value { color: #3ddc84; }
  .next-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 12px; color: #8a97a8; }
  .next-and-status { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  #next-box { width: 52px; height: 52px; background: #151c27; border: 1px solid #232d3d; border-radius: 10px; position: relative; flex-shrink: 0; }
  #status { font-size: 13px; color: #e6944d; flex: 1; }
  #board-wrap { display: flex; justify-content: center; margin-bottom: 16px; }
  #board {
    background: #0e141b; border-radius: 8px; padding: 0;
    display: grid; gap: 1px;
    box-shadow: 0 0 0 1px #232d3d;
  }
  .cell { border-radius: 3px; transition: background-color .06s ease, opacity .06s ease; }
  .controls { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .row2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  button.ctrl {
    height: 52px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06); color: #e8edf5; font-size: 15px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  button.ctrl:active { transform: scale(0.94); filter: brightness(1.3); }
  button.ctrl svg { width: 22px; height: 22px; }
  #restart-link {
    text-align: center; margin-top: 10px; font-size: 12px; color: #8a97a8;
    background: none; border: none; display: inline-flex; gap: 6px; align-items: center;
    width: 100%; justify-content: center; padding: 8px;
  }
  #overlay {
    position: absolute; inset: 0; background: rgba(5,7,10,0.88);
    display: none; align-items: center; justify-content: center; flex-direction: column;
    border-radius: 8px; gap: 10px; text-align: center; padding: 20px;
  }
  #overlay.show { display: flex; }
  #overlay h2 { margin: 0; font-size: 20px; font-weight: 600; }
  #overlay p { margin: 0; font-size: 14px; color: #8a97a8; }
  #board-outer { position: relative; }
</style>
</head>
<body>
<div id="app">
  <div class="title-row">
    <h1>Tetris</h1>
    <span class="best">Terbaik: <span id="best-score">0</span></span>
  </div>

  <div class="stats">
    <div class="stat score">
      <div class="label">Skor</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="stat">
      <div class="label">Baris</div>
      <div class="value" id="lines">0</div>
    </div>
    <div class="stat">
      <div class="label">Level</div>
      <div class="value" id="level">1</div>
    </div>
  </div>

  <div class="next-row">
    <span>Berikutnya</span>
    <span id="target">Target 1500</span>
  </div>
  <div class="next-and-status">
    <div id="next-box"></div>
    <div id="status"></div>
  </div>

  <div id="board-wrap">
    <div id="board-outer">
      <div id="board"></div>
      <div id="overlay">
        <h2 id="overlay-title">Game selesai</h2>
        <p id="overlay-sub">Skor akhir: 0</p>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="row3">
      <button class="ctrl" id="btn-left" aria-label="Kiri">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="ctrl" id="btn-rotate" aria-label="Putar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 10-3.4 7.03M21 12v5h-5"/></svg>
      </button>
      <button class="ctrl" id="btn-right" aria-label="Kanan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div class="row2">
      <button class="ctrl" id="btn-soft" aria-label="Turun">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
        Turun
      </button>
      <button class="ctrl" id="btn-hard" aria-label="Jatuh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v10M6 9l6 4 6-4M5 19h14"/></svg>
        Jatuh
      </button>
    </div>
  </div>

  <button id="restart-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 10-3.4 7.03M21 12v5h-5"/></svg>
    Mulai ulang
  </button>
</div>

<script>
(function () {
  'use strict';

  var COLS = 10, ROWS = 20;
  var SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };
  var COLORS = { I:'#4dd8e6', O:'#e6c64d', T:'#b24de6', S:'#4de672', Z:'#e64d5c', J:'#4d6fe6', L:'#e6944d' };
  var KEYS = Object.keys(SHAPES);

  function rotateCells(cells, times) {
    var out = cells, n = ((times % 4) + 4) % 4;
    for (var t = 0; t < n; t++) out = out.map(function (c) { return [3 - c[1], c[0]]; });
    return out;
  }
  function newBag() {
    var b = KEYS.slice();
    for (var i = b.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = b[i]; b[i] = b[j]; b[j] = tmp;
    }
    return b;
  }
  var bag = newBag();
  function nextFromBag() { if (bag.length === 0) bag = newBag(); return bag.shift(); }

  function emptyBoard() { var rows = []; for (var y = 0; y < ROWS; y++) rows.push(new Array(COLS).fill(null)); return rows; }

  var board, current, nextKey, score, lines, level, target, gameOver;

  function spawn(key) { return { key: key, rot: 0, x: 3, y: -2 }; }
  function pieceCells(p) { return rotateCells(SHAPES[p.key], p.rot).map(function (c) { return [c[0] + p.x, c[1] + p.y]; }); }
  function collides(p, dx, dy, dr) {
    var test = { key: p.key, rot: p.rot + dr, x: p.x + dx, y: p.y + dy };
    var cells = pieceCells(test);
    for (var i = 0; i < cells.length; i++) {
      var x = cells[i][0], y = cells[i][1];
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && board[y][x]) return true;
    }
    return false;
  }
  var LINE_SCORE = [0, 40, 100, 300, 1200];
  function gravityMs() { return Math.max(100, 1000 - (level - 1) * 75); }
  function targetFor(l) { return l * 1000 + 500; }

  var bestScore = 0;
  try { bestScore = parseInt(localStorage.getItem('tetris_best') || '0', 10) || 0; } catch (e) {}

  function resetGame() {
    board = emptyBoard();
    bag = newBag();
    current = spawn(nextFromBag());
    nextKey = nextFromBag();
    score = 0; lines = 0; level = 1; target = targetFor(level);
    gameOver = false;
    document.getElementById('overlay').classList.remove('show');
  }

  function saveBestIfNeeded() {
    if (score > bestScore) {
      bestScore = score;
      try { localStorage.setItem('tetris_best', String(bestScore)); } catch (e) {}
    }
  }

  function lockPiece(dropCells) {
    var cells = pieceCells(current);
    for (var i = 0; i < cells.length; i++) {
      var x = cells[i][0], y = cells[i][1];
      if (y < 0) { gameOver = true; saveBestIfNeeded(); return; }
      board[y][x] = current.key;
    }
    if (dropCells > 0) score += dropCells * 2;

    var cleared = 0;
    for (var yy = ROWS - 1; yy >= 0; yy--) {
      if (board[yy].every(function (c) { return c !== null; })) {
        board.splice(yy, 1);
        board.unshift(new Array(COLS).fill(null));
        cleared++;
        yy++;
      }
    }
    if (cleared > 0) {
      score += LINE_SCORE[cleared] * level;
      lines += cleared;
      var nl = Math.floor(lines / 10) + 1;
      if (nl !== level) { level = nl; target = targetFor(level); }
    }

    current = spawn(nextKey);
    nextKey = nextFromBag();
    if (collides(current, 0, 0, 0)) { gameOver = true; saveBestIfNeeded(); }
  }

  function softDropOne() {
    if (!collides(current, 0, 1, 0)) current.y += 1;
    else lockPiece(0);
  }
  function moveSide(dir) {
    if (gameOver) return;
    var dx = dir === 'left' ? -1 : 1;
    if (!collides(current, dx, 0, 0)) { current.x += dx; render(); }
  }
  function rotatePiece() {
    if (gameOver || current.key === 'O') return;
    if (!collides(current, 0, 0, 1)) { current.rot += 1; render(); return; }
    var kicks = [-1, 1, -2, 2];
    for (var i = 0; i < kicks.length; i++) {
      if (!collides(current, kicks[i], 0, 1)) { current.x += kicks[i]; current.rot += 1; render(); return; }
    }
  }
  function softDrop() {
    if (gameOver) return;
    softDropOne();
    render();
  }
  function hardDrop() {
    if (gameOver) return;
    var cells = 0;
    while (!collides(current, 0, 1, 0)) { current.y += 1; cells++; }
    lockPiece(cells);
    render();
  }
  function ghostCells() {
    var g = { key: current.key, rot: current.rot, x: current.x, y: current.y };
    while (!collides(g, 0, 1, 0)) g.y += 1;
    return pieceCells(g);
  }

  var CELL = Math.min(30, Math.floor((Math.min(window.innerWidth, 420) - 32) / COLS));
  var boardEl = document.getElementById('board');
  boardEl.style.gridTemplateColumns = 'repeat(' + COLS + ', ' + CELL + 'px)';
  boardEl.style.gridTemplateRows = 'repeat(' + ROWS + ', ' + CELL + 'px)';
  var cellEls = [];
  for (var y0 = 0; y0 < ROWS; y0++) {
    var row = [];
    for (var x0 = 0; x0 < COLS; x0++) {
      var d = document.createElement('div');
      d.className = 'cell';
      d.style.background = '#141b24';
      boardEl.appendChild(d);
      row.push(d);
    }
    cellEls.push(row);
  }

  var nextEl = document.getElementById('next-box');
  var scoreEl = document.getElementById('score');
  var linesEl = document.getElementById('lines');
  var levelEl = document.getElementById('level');
  var targetEl = document.getElementById('target');
  var bestEl = document.getElementById('best-score');
  var statusEl = document.getElementById('status');
  var overlayEl = document.getElementById('overlay');
  var overlayTitleEl = document.getElementById('overlay-title');
  var overlaySubEl = document.getElementById('overlay-sub');

  function render() {
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var key = board[y][x];
        cellEls[y][x].style.background = key ? COLORS[key] : '#141b24';
        cellEls[y][x].style.opacity = '1';
      }
    }
    if (!gameOver) {
      var ghosts = ghostCells();
      for (var i = 0; i < ghosts.length; i++) {
        var gx = ghosts[i][0], gy = ghosts[i][1];
        if (gy >= 0 && gy < ROWS && gx >= 0 && gx < COLS) {
          cellEls[gy][gx].style.background = COLORS[current.key];
          cellEls[gy][gx].style.opacity = '0.28';
        }
      }
      var cells = pieceCells(current);
      for (var j = 0; j < cells.length; j++) {
        var cx = cells[j][0], cy = cells[j][1];
        if (cy >= 0 && cy < ROWS) {
          cellEls[cy][cx].style.background = COLORS[current.key];
          cellEls[cy][cx].style.opacity = '1';
        }
      }
    }

    scoreEl.textContent = score;
    linesEl.textContent = lines;
    levelEl.textContent = level;
    targetEl.textContent = 'Target ' + target;
    bestEl.textContent = Math.max(bestScore, score);

    nextEl.innerHTML = '';
    var ncells = SHAPES[nextKey];
    var xs = ncells.map(function (c) { return c[0]; });
    var ys = ncells.map(function (c) { return c[1]; });
    var minX = Math.min.apply(null, xs), minY = Math.min.apply(null, ys);
    for (var k = 0; k < ncells.length; k++) {
      var ncx = ncells[k][0], ncy = ncells[k][1];
      var b = document.createElement('div');
      b.style.position = 'absolute';
      b.style.width = '10px'; b.style.height = '10px';
      b.style.left = (8 + (ncx - minX) * 11) + 'px';
      b.style.top = (8 + (ncy - minY) * 11) + 'px';
      b.style.background = COLORS[nextKey];
      b.style.borderRadius = '2px';
      nextEl.appendChild(b);
    }

    if (gameOver) {
      statusEl.textContent = '';
      overlayTitleEl.textContent = 'Game selesai';
      overlaySubEl.textContent = 'Skor akhir: ' + score + ' (level ' + level + ', ' + lines + ' baris)';
      overlayEl.classList.add('show');
    } else {
      statusEl.textContent = '';
    }
  }

  document.getElementById('btn-left').addEventListener('click', function () { moveSide('left'); });
  document.getElementById('btn-right').addEventListener('click', function () { moveSide('right'); });
  document.getElementById('btn-rotate').addEventListener('click', rotatePiece);
  document.getElementById('btn-soft').addEventListener('click', softDrop);
  document.getElementById('btn-hard').addEventListener('click', hardDrop);
  document.getElementById('restart-link').addEventListener('click', function () { resetGame(); render(); });
  overlayEl.addEventListener('click', function () { resetGame(); render(); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') moveSide('left');
    else if (e.key === 'ArrowRight') moveSide('right');
    else if (e.key === 'ArrowUp') rotatePiece();
    else if (e.key === 'ArrowDown') softDrop();
    else if (e.key === ' ') { e.preventDefault(); hardDrop(); }
  });

  var touchStartX = 0, touchStartY = 0, touchMoved = false;
  boardEl.addEventListener('touchstart', function (e) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchMoved = false;
  }, { passive: true });
  boardEl.addEventListener('touchmove', function (e) {
    var dx = e.touches[0].clientX - touchStartX;
    var dy = e.touches[0].clientY - touchStartY;
    if (Math.abs(dx) > 24 && !touchMoved) {
      moveSide(dx > 0 ? 'right' : 'left');
      touchStartX = e.touches[0].clientX;
      touchMoved = true;
    } else if (dy > 24 && !touchMoved) {
      softDrop();
      touchStartY = e.touches[0].clientY;
    }
  }, { passive: true });
  boardEl.addEventListener('touchend', function (e) {
    if (!touchMoved) rotatePiece();
  });

  var lastFrame = Date.now();
  function loop() {
    var now = Date.now();
    if (!gameOver) {
      var interval = gravityMs();
      if (now - lastFrame >= interval) {
        lastFrame = now;
        softDropOne();
        render();
      }
    } else {
      lastFrame = now;
    }
    requestAnimationFrame(loop);
  }

  resetGame();
  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
